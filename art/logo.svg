<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512">
  <title>Workerless</title>
  <!--
    The Gap: a W whose middle apex is missing. In its place, a dot lifts up:
    the worker is gone, the job runs in the space it left.
    Outer and inner arms share one slope (dx/dy = 0.4). Content is centred on 32,32.
  -->
  <defs>
    <linearGradient id="wl-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A1C17"/>
      <stop offset="1" stop-color="#120B09"/>
    </linearGradient>
    <linearGradient id="wl-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".14"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wl-stroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF9F2"/>
      <stop offset="1" stop-color="#F1E0CC"/>
    </linearGradient>
    <linearGradient id="wl-dot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A55"/>
      <stop offset="1" stop-color="#FF3D2E"/>
    </linearGradient>
    <radialGradient id="wl-halo" cx="32" cy="18" r="13" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF5A36" stop-opacity=".45"/>
      <stop offset="1" stop-color="#FF5A36" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14.5" fill="url(#wl-bg)"/>
  <rect width="64" height="64" rx="14.5" fill="url(#wl-shine)"/>
  <rect x=".6" y=".6" width="62.8" height="62.8" rx="13.9" fill="none" stroke="#FFFFFF" stroke-opacity=".08" stroke-width="1.2"/>
  <circle cx="32" cy="18" r="13" fill="url(#wl-halo)"/>
  <path d="M10.5 20 21.8 48 26.8 35.5" fill="none" stroke="url(#wl-stroke)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M53.5 20 42.2 48 37.2 35.5" fill="none" stroke="url(#wl-stroke)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="32" cy="18" r="5.6" fill="url(#wl-dot)"/>
  <ellipse cx="30.2" cy="16.1" rx="1.9" ry="1.4" fill="#FFFFFF" fill-opacity=".45"/>
</svg>
