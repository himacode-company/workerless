<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <title>Workerless - Laravel queues without cron, SSH or queue:work</title>
  <defs>
    <radialGradient id="og-glow" cx="250" cy="300" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF5A36" stop-opacity=".30"/>
      <stop offset="1" stop-color="#FF5A36" stop-opacity="0"/>
    </radialGradient>
    <pattern id="og-dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="13" cy="13" r="1.3" fill="#FFF4E8" fill-opacity=".16"/>
    </pattern>
    <linearGradient id="og-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset=".4" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="og-mask"><rect width="1280" height="640" fill="url(#og-fade)"/></mask>

    <linearGradient id="og-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A1C17"/>
      <stop offset="1" stop-color="#120B09"/>
    </linearGradient>
    <linearGradient id="og-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".14"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="og-stroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF9F2"/>
      <stop offset="1" stop-color="#F1E0CC"/>
    </linearGradient>
    <linearGradient id="og-dot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A55"/>
      <stop offset="1" stop-color="#FF3D2E"/>
    </linearGradient>
    <radialGradient id="og-halo" cx="32" cy="18" r="13" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF5A36" stop-opacity=".45"/>
      <stop offset="1" stop-color="#FF5A36" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="#110A08"/>
  <rect width="1280" height="640" fill="url(#og-glow)"/>
  <rect width="1280" height="640" fill="url(#og-dots)" mask="url(#og-mask)"/>

  <!-- Large ghost mark on the right -->
  <g transform="translate(700 40) rotate(-8 300 300) scale(9.4)" opacity=".09">
    <path d="M10.5 20 21.8 48 26.8 35.5" fill="none" stroke="#FFF4E8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M53.5 20 42.2 48 37.2 35.5" fill="none" stroke="#FFF4E8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="32" cy="18" r="5.6" fill="#FF5A36"/>
  </g>

  <!-- App icon -->
  <g transform="translate(96 138) scale(2.5)">
    <rect width="64" height="64" rx="14.5" fill="url(#og-bg)"/>
    <rect width="64" height="64" rx="14.5" fill="url(#og-shine)"/>
    <rect x=".6" y=".6" width="62.8" height="62.8" rx="13.9" fill="none" stroke="#FFFFFF" stroke-opacity=".1" stroke-width="1.2"/>
    <circle cx="32" cy="18" r="13" fill="url(#og-halo)"/>
    <path d="M10.5 20 21.8 48 26.8 35.5" fill="none" stroke="url(#og-stroke)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M53.5 20 42.2 48 37.2 35.5" fill="none" stroke="url(#og-stroke)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="32" cy="18" r="5.6" fill="url(#og-dot)"/>
    <ellipse cx="30.2" cy="16.1" rx="1.9" ry="1.4" fill="#FFFFFF" fill-opacity=".45"/>
  </g>

  <text x="290" y="238" font-family="'Segoe UI Variable Display', 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="124" font-weight="800" letter-spacing="-6" fill="#FFF4E8">worker<tspan fill="#FF5A36">less</tspan></text>

  <text x="96" y="382" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="600" fill="#FFF4E8">Laravel queues without cron, SSH or queue:work.</text>
  <text x="96" y="436" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="30" fill="#FFF4E8" fill-opacity=".62">Built for shared hosting. Jobs run right after the response.</text>

  <rect x="96" y="482" width="690" height="64" rx="14" fill="#FFF4E8" fill-opacity=".06" stroke="#FFF4E8" stroke-opacity=".14"/>
  <text x="124" y="523" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="25" fill="#FFF4E8"><tspan fill="#FF5A36">$</tspan> composer require himacode-company/workerless</text>

  <text x="1184" y="580" text-anchor="end" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="22" font-weight="600" fill="#FFF4E8" fill-opacity=".45">Laravel 10-13 · PHP 8.2+ · MIT</text>
</svg>
